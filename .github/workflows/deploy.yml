name: Verify and deploy screener

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screener-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src
      - run: uv run mypy
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t atlas-screener:verify .
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen --extra dev
      - name: Verify isolated research packaging without exchange network
        run: uv run python -m tests.research_container_smoke --image atlas-screener:verify
      - name: Verify packaged application without exchange access
        run: |
          docker run -d --name screener-check --network none -e ATLAS_SCREENER_CRON_ENABLED=false -e ATLAS_STATE_DB_PATH=/app/state/watchlist.sqlite3 atlas-screener:verify
          for attempt in $(seq 1 20); do
            if docker exec screener-check python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"; then break; fi
            sleep 1
          done
          docker exec screener-check python -c "import json, urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/')); assert d['mode']=='screener' and d['order_execution_enabled'] is False"
      - if: always()
        run: docker logs screener-check && docker rm -f screener-check

  deploy:
    needs: [backend, frontend, container]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: GCP_VM_IP
    runs-on: ubuntu-latest
    steps:
      - name: Deploy verified commit to GCP
        uses: appleboy/ssh-action@v1.2.0
        env:
          RELEASE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER || 'deploy' }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          command_timeout: 30m
          envs: RELEASE_SHA
          script: |
            set -eu
            # Reclaim disk space from build cache, logs, unused images, and old releases
            echo "=== Checking disk space ==="
            df -h
            journalctl --vacuum-size=50M 2>/dev/null || true
            sudo apt-get clean 2>/dev/null || apt-get clean 2>/dev/null || true
            docker builder prune -af || true
            docker image prune -af || true
            if [ -d /home/deploy/atlas-releases ]; then
              active_release=$(docker inspect alfa-terminal-atlas-1 --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' 2>/dev/null || echo "")
              for d in /home/deploy/atlas-releases/*; do
                if [ -d "$d" ] && [ "$d" != "$active_release" ] && [ "$d" != "/home/deploy/atlas-releases/$RELEASE_SHA" ]; then
                  echo "Pruning old release worktree: $d"
                  rm -rf "$d" || true
                fi
              done
              git -C /home/deploy/alfa-terminal worktree prune 2>/dev/null || true
            fi
            echo "=== Disk space after cleanup ==="
            df -h

            cd /home/deploy/alfa-terminal
            git fetch origin main
            git cat-file -e "$RELEASE_SHA^{commit}"
            release="/home/deploy/atlas-releases/$RELEASE_SHA"
            mkdir -p /home/deploy/atlas-releases
            if [ ! -d "$release" ]; then
              git worktree add --detach "$release" "$RELEASE_SHA"
            fi
            export ATLAS_DATA_DIR=/home/deploy/alfa-terminal/data
            export ATLAS_IMAGE_TAG="$RELEASE_SHA"
            mkdir -p "$ATLAS_DATA_DIR"
            # Preserve deploy data and the SQLite state volume for the non-root container UID 10001.
            # The bound data path and named state volume are root-owned by default and must be fixed
            # before Compose starts the app or startup fails with permission-denied writes.
            docker volume inspect alfa-terminal_atlas-state >/dev/null 2>&1 || docker volume create alfa-terminal_atlas-state
            docker run --rm \
              -v alfa-terminal_atlas-state:/state \
              -v "$ATLAS_DATA_DIR:/data" \
              alpine:3.20 \
              sh -c 'chown -R 10001:10001 /state /data && chmod -R u+rwX /state /data'
            docker compose --project-name alfa-terminal --file "$release/compose.yaml" build
            if ! docker compose --project-name alfa-terminal --file "$release/compose.yaml" up -d --wait --wait-timeout 300 --remove-orphans; then
              echo "=== DEPLOYMENT FAILED: DOCKER COMPOSE LOGS ==="
              docker compose --project-name alfa-terminal --file "$release/compose.yaml" logs --tail 200
              exit 1
            fi
            docker compose --project-name alfa-terminal --file "$release/compose.yaml" exec -T atlas python -c "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/')); assert d['mode']=='screener' and d['order_execution_enabled'] is False"
