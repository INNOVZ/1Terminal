services:
  atlas:
    build: .
    image: atlas-screener:${ATLAS_IMAGE_TAG:-local}
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      - atlas-state:/app/state
      - ${ATLAS_DATA_DIR:-./data}:/app/data
    environment:
      ATLAS_STATE_DB_PATH: /app/state/atlas_state.sqlite3
      ATLAS_ENVIRONMENT: production
      ATLAS_SCREENER_CRON_ENABLED: ${ATLAS_SCREENER_CRON_ENABLED:-true}
      ATLAS_SCREENER_INTERVAL_HOURS: ${ATLAS_SCREENER_INTERVAL_HOURS:-4}
      ATLAS_EXCLUDED_BASE_ASSETS: ${ATLAS_EXCLUDED_BASE_ASSETS:-USDT,USDC,FDUSD,TUSD,USDP,DAI,EUR}
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=15)
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  research-ranks:
    profiles: [research]
    build: .
    image: atlas-screener:${ATLAS_IMAGE_TAG:-local}
    user: "10001:10001"
    command: [python, -m, algotrader.cli, research-worker, --role, ranks, --session-id, "${ATLAS_RESEARCH_SESSION_ID:-disabled}", --archive-dir, /app/data/research]
    volumes:
      - ${ATLAS_RESEARCH_ARCHIVE_DIR:-./data/research}:/app/data/research
    environment:
      ATLAS_SCREENER_CRON_ENABLED: "false"
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 120s
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -m, algotrader.cli, research-health, --role, ranks, --session-id, "${ATLAS_RESEARCH_SESSION_ID:-disabled}", --archive-dir, /app/data/research]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  research-outcomes:
    profiles: [research]
    build: .
    image: atlas-screener:${ATLAS_IMAGE_TAG:-local}
    user: "10001:10001"
    command: [python, -m, algotrader.cli, research-worker, --role, outcomes, --session-id, "${ATLAS_RESEARCH_SESSION_ID:-disabled}", --archive-dir, /app/data/research]
    volumes:
      - ${ATLAS_RESEARCH_ARCHIVE_DIR:-./data/research}:/app/data/research
    environment:
      ATLAS_SCREENER_CRON_ENABLED: "false"
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 120s
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -m, algotrader.cli, research-health, --role, outcomes, --session-id, "${ATLAS_RESEARCH_SESSION_ID:-disabled}", --archive-dir, /app/data/research]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

volumes:
  atlas-state:
