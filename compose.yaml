services:
  atlas:
    build: .
    env_file: .env
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      - atlas-state:/app/state
      - ./data:/app/data
    environment:
      ATLAS_STATE_DB_PATH: /app/state/atlas_state.sqlite3
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  atlas-state:
