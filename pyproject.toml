[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "atlas-algotrader"
version = "0.1.2"
description = "Public-data cryptocurrency screener and research portal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "structlog>=25.5,<26",
  "uvicorn[standard]>=0.40,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.19,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.14,<1",
]

[project.scripts]
atlas = "algotrader.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/algotrader"]

[tool.pytest.ini_options]
addopts = "-q -W error::ResourceWarning -W error::pytest.PytestUnraisableExceptionWarning"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501", "SIM102", "ASYNC109"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["algotrader"]
